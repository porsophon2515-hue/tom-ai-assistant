
<!-- TOM AI Assistant V3 -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>TOM AI Assistant</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh;padding:20px
}
.app{max-width:600px;margin:auto}
header{text-align:center;padding:30px 10px}
.logo{font-size:55px}
h1{margin:8px 0;color:#65d6ad}
.sub{color:#aab7c8;font-size:14px}
.status{
 background:#193c36;color:#72e3bb;
 padding:10px;border-radius:12px;
 text-align:center;margin:15px 0
}
.chat{
 background:#1c293b;border-radius:16px;
 padding:15px;min-height:300px;
 margin-bottom:15px
}
.message{
 background:#293b51;padding:13px;
 border-radius:12px;margin:10px 0;
 line-height:1.6;white-space:pre-wrap
}
.user{background:#174c42}
textarea,input{
 width:100%;border:0;border-radius:12px;
 padding:14px;font-size:16px;
 background:#fff;color:#111;margin-bottom:10px
}
textarea{height:85px}
button{
 border:0;border-radius:12px;padding:14px;
 font-size:15px;font-weight:bold;cursor:pointer
}
.controls{display:flex;gap:8px;margin-top:10px}
.controls button{flex:1}
.send{background:#38c99b;color:#10251f}
.voice{background:#365477;color:white}
.speak{background:#53617b;color:white}
.login-box{
 background:#1c293b;padding:22px;
 border-radius:16px;margin:20px 0
}
.login-btn{
 width:100%;background:#38c99b;
 color:#10251f;margin-top:5px
}
.logout-btn{
 background:#76515b;color:white;
 width:100%;margin-top:12px
}
.error{color:#ff9999;font-size:14px;margin-top:10px}
.note{
 color:#aab7c8;font-size:12px;
 line-height:1.6;margin-top:20px
}
.hidden{display:none}
</style>
</head>

<body>
<div class="app">

<header>
<div class="logo">🤖</div>
<h1>TOM AI</h1>
<div class="sub">ผู้ช่วยส่วนตัวของคุณ</div>
</header>

<!-- LOGIN -->
<div id="loginPanel" class="login-box">
<h3>เข้าสู่ระบบ TOM AI</h3>

<input id="username"
 type="text"
 placeholder="Username"
 autocomplete="username">

<input id="password"
 type="password"
 placeholder="Password"
 autocomplete="current-password">

<button class="login-btn" onclick="login()">
เข้าสู่ระบบ
</button>

<div id="loginError" class="error"></div>
</div>

<!-- CHAT -->
<div id="chatPanel" class="hidden">

<div class="status">● TOM AI INTERFACE ONLINE</div>

<div id="userInfo" class="sub"></div>

<div class="chat" id="chat">
<div class="message">
สวัสดีครับ ผมทอมครับ

ยินดีต้อนรับสู่ TOM AI
ตอนนี้ระบบพร้อมรับข้อความและเสียงแล้วครับ
</div>
</div>

<textarea id="input"
 placeholder="พิมพ์ข้อความ หรือกดปุ่มไมโครโฟน..."></textarea>

<div class="controls">
<button class="voice" onclick="listen()">🎤 พูด</button>
<button class="send" onclick="sendMessage()">ส่งข้อความ</button>
</div>

<div class="controls">
<button class="speak" onclick="speakLast()">🔊 อ่านคำตอบ</button>
<button class="speak" onclick="stopSpeak()">หยุดเสียง</button>
</div>

<button class="logout-btn" onclick="logout()">
ออกจากระบบ
</button>

<div class="note">
TOM AI BRAIN V3
ระบบ Login และความจำแยกตามบัญชีผู้ใช้
</div>

</div>
</div>

<script>
const API_URL =
"https://tom-ai-brain.porsophon2515.workers.dev";

let sessionToken = "";
let lastReply = "สวัสดีครับ ผมทอมครับ";

function showChat(username){
 document.getElementById("loginPanel").classList.add("hidden");
 document.getElementById("chatPanel").classList.remove("hidden");
 document.getElementById("userInfo").textContent =
 "เข้าสู่ระบบแล้ว: " + username;
}

function showLogin(){
 document.getElementById("loginPanel").classList.remove("hidden");
 document.getElementById("chatPanel").classList.add("hidden");
}

async function login(){
 const username =
 document.getElementById("username").value.trim();

 const password =
 document.getElementById("password").value;

 const errorBox = document.getElementById("loginError");
 errorBox.textContent = "";

 if(!username || !password){
  errorBox.textContent = "กรุณากรอก Username และ Password";
  return;
 }

 try{
  const response = await fetch(
   API_URL + "/auth/login",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     username:username,
     password:password
    })
   }
  );

  const data = await response.json();

  if(!response.ok || !data.ok || !data.token){
   throw new Error(data.error || "เข้าสู่ระบบไม่สำเร็จ");
  }

  sessionToken = data.token;

  sessionStorage.setItem("tom_session_token",sessionToken);
  sessionStorage.setItem("tom_username",data.user.username);
  sessionStorage.setItem("tom_expires_at",String(data.expiresAt));

  document.getElementById("password").value = "";

  showChat(data.user.username);

 }catch(error){
  errorBox.textContent =
   "เข้าสู่ระบบไม่ได้: " + error.message;
 }
}

function logout(){
 sessionToken = "";

 sessionStorage.removeItem("tom_session_token");
 sessionStorage.removeItem("tom_username");
 sessionStorage.removeItem("tom_expires_at");

 document.getElementById("chat").innerHTML = "";
 document.getElementById("password").value = "";

 showLogin();
}

function addMessage(text,type){
 const chat = document.getElementById("chat");
 const div = document.createElement("div");

 div.className =
  "message " + (type==="user"?"user":"");

 div.textContent = text;

 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(){
 const input = document.getElementById("input");
 const text = input.value.trim();

 if(!text) return;

 if(!sessionToken){
  alert("กรุณาเข้าสู่ระบบก่อนใช้งาน");
  logout();
  return;
 }

 addMessage(text,"user");
 input.value = "";

 lastReply = "กำลังคิดคำตอบครับ...";
 addMessage(lastReply,"bot");

 const chat = document.getElementById("chat");

 try{
  const response = await fetch(
   API_URL + "/chat",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "Authorization":"Bearer " + sessionToken
    },
    body:JSON.stringify({
     message:text
    })
   }
  );

  const data = await response.json();

  if(response.status === 401){
   logout();
   throw new Error("Token หมดอายุหรือไม่ถูกต้อง กรุณาเข้าสู่ระบบใหม่");
  }

  if(!response.ok || data.ok === false){
   throw new Error(data.error || "ระบบ AI ขัดข้อง");
  }

  lastReply =
   data.reply || data.answer || data.message ||
   "ยังไม่มีคำตอบจากระบบครับ";

  chat.lastElementChild.textContent = lastReply;

 }catch(error){
  lastReply =
   "ขออภัยครับ เชื่อมต่อสมอง AI ไม่สำเร็จ: " +
   error.message;

  if(chat.lastElementChild){
   chat.lastElementChild.textContent = lastReply;
  }
 }
}

function listen(){
 const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  alert("เบราว์เซอร์นี้ยังไม่รองรับการรับเสียง กรุณาใช้ Google Chrome");
  return;
 }

 const recognition = new SpeechRecognition();
 recognition.lang = "th-TH";
 recognition.interimResults = false;

 recognition.onresult = function(event){
  document.getElementById("input").value =
   event.results[0][0].transcript;
 };

 recognition.onerror = function(){
  alert("ไม่สามารถรับเสียงได้ กรุณาอนุญาตใช้ไมโครโฟน");
 };

 recognition.start();
}

function speakLast(){
 if(!("speechSynthesis" in window)){
  alert("อุปกรณ์นี้ไม่รองรับการอ่านข้อความ");
  return;
 }

 speechSynthesis.cancel();

 const msg = new SpeechSynthesisUtterance(lastReply);
 msg.lang = "th-TH";
 msg.rate = 1;

 speechSynthesis.speak(msg);
}

function stopSpeak(){
 speechSynthesis.cancel();
}

// ตรวจสอบ Login ที่บันทึกไว้ในแท็บปัจจุบัน
(function(){
 const token =
  sessionStorage.getItem("tom_session_token");

 const username =
  sessionStorage.getItem("tom_username");

 const expiresAt =
  Number(sessionStorage.getItem("tom_expires_at") || 0);

 const now = Math.floor(Date.now()/1000);

 if(token && username && expiresAt > now){
  sessionToken = token;
  showChat(username);
 }else{
  sessionStorage.removeItem("tom_session_token");
  sessionStorage.removeItem("tom_username");
  sessionStorage.removeItem("tom_expires_at");
  showLogin();
 }
})();
</script>

</body>
</html>
